spring:
  application:
    name: elasticsearch-api

  # Kafka Consumer 설정
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: elasticsearch-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          com.sparta.postapi.event.PostCreatedEvent:com.sparta.elasticapi.post.event.PostCreatedEvent,
          com.sparta.postapi.event.PostUpdatedEvent:com.sparta.elasticapi.post.event.PostUpdatedEvent,
          com.sparta.postapi.event.PostDeletedEvent:com.sparta.elasticapi.post.event.PostDeletedEvent
    listener:
      ack-mode: manual

  # Elasticsearch 설정
  elasticsearch:
    uris: http://elasticsearch:9200
    connection-timeout: 5s
    socket-timeout: 60s

server:
  port: 8081

logging:
  level:
    com.sns.elasticsearch: DEBUG
    org.springframework.kafka: INFO
    org.elasticsearch: INFO
