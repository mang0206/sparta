server.port=8083
spring.application.name=order-api

# DB
spring.datasource.url=jdbc:mysql://order-db:3306/orderdb
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# MySQL8Dialect? ?? ???? ?? ?????, ????? ?? ????? ?????.
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Kafka ?? ?? (Docker ?? ???? ?? ??)
spring.kafka.bootstrap-servers=kafka:29092

# Producer ??
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# ??? ?? ? ??? ??
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.retry.backoff.ms=1000

# Consumer ??
spring.kafka.consumer.group-id=order-api-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ?? ??? ??? ??? ?? (??? ??? ??? ?? ??)
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate

# Logging (SLF4J ??? ??? ?? ?? ?????? ?? ????? ?? ??)
logging.level.root=INFO
logging.level.com.ecommerce.order=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
