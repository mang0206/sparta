global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'post-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['post-api:8080']

  - job_name: 'elasticsearch-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['elasticsearch-api:8081']